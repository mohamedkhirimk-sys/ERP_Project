server:
  port: 8092

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: identity-route
          uri: lb://identity-service
          predicates:
            - Path=/api/auth/**
            - Path=/api/identity/**
        - id: inventory-route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: product-route
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: payment-route
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: sales-route
          uri: lb://sales-service
          predicates:
            - Path=/api/customers/**
            - Path=/api/invoices/**
        - id: hrm-route
          uri: lb://hrm-service
          predicates:
            - Path=/api/employees/**
            - Path=/api/attendance/**
            - Path=/api/leaves/**
        - id: finance-route
          uri: lb://finance-service
          predicates:
            - Path=/api/accounts/**
            - Path=/api/journal-entries/**
            - Path=/api/payroll/**
        - id: procurement-route
          uri: lb://procurement-service
          predicates:
            - Path=/api/vendors/**
            - Path=/api/purchase-orders/**
            - Path=/api/goods-received/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            duplex: false

app:
  jwt:
    secret: c29tZS1zZWNyZXQta2V5LXdoaWNoLWlzLWp3dC1zdWl0YWJsZQ==

eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
