spring.application.name=identity-service
server.port=8087

# Database Configuration

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_db
spring.datasource.username=postgres
spring.datasource.password=md1962km
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# 'update' will automatically create the tables for you based on your Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging (Optional but helpful)
logging.level.org.hibernate.SQL=DEBUG


# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/


# JWT Configuration
# This is used by your JwtUtils class to sign the token
jwt.secret=my_super_secret_key_for_jwt_validation_1234567890

