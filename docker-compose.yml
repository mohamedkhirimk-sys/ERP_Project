networks:
  erp-network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17
    container_name: erp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  eureka-server:
    build:
      context: ./backend/eureka-server
    container_name: erp-eureka
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
    networks:
      - erp-network

  identity-service:
    build:
      context: ./backend/identity-service
    container_name: erp-identity
    ports:
      - "8086:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - erp-network

  product-service:
